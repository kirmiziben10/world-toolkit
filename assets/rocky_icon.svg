<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Outer border (matching other icons) -->
<rect x="1.5" y="1.5" width="45" height="45" rx="2" stroke="#5F6A5E" stroke-linejoin="round"/>
<rect x="4.5" y="4.5" width="39" height="39" stroke="white" stroke-opacity="0.66"/>
<!-- Background gradient (earthy tones) -->
<rect x="5" y="5" width="38" height="38" fill="url(#bg)"/>
<!-- Ground -->
<ellipse cx="24" cy="40" rx="16" ry="3" fill="#6B8E5A" opacity="0.5"/>
<!-- Body (torso rock) -->
<ellipse cx="24" cy="28" rx="9" ry="7" fill="url(#rock)" stroke="#6B6B6B" stroke-width="0.8"/>
<!-- Head (top rock) -->
<ellipse cx="24" cy="17" rx="7" ry="6" fill="url(#rock2)" stroke="#6B6B6B" stroke-width="0.8"/>
<!-- Left eye -->
<ellipse cx="21" cy="16" rx="2" ry="2.2" fill="white"/>
<ellipse cx="21.3" cy="16.2" rx="1.1" ry="1.2" fill="#2a2a4a"/>
<circle cx="21.8" cy="15.6" r="0.5" fill="white"/>
<!-- Right eye -->
<ellipse cx="27" cy="16" rx="2" ry="2.2" fill="white"/>
<ellipse cx="27.3" cy="16.2" rx="1.1" ry="1.2" fill="#2a2a4a"/>
<circle cx="27.8" cy="15.6" r="0.5" fill="white"/>
<!-- Smile -->
<path d="M21 19.5Q24 22 27 19.5" stroke="#4a4a4a" stroke-width="0.8" stroke-linecap="round" fill="none"/>
<!-- Left arm rock -->
<ellipse cx="13" cy="27" rx="3.5" ry="2.5" transform="rotate(-20 13 27)" fill="url(#rock3)" stroke="#6B6B6B" stroke-width="0.6"/>
<!-- Right arm rock -->
<ellipse cx="35" cy="27" rx="3.5" ry="2.5" transform="rotate(20 35 27)" fill="url(#rock3)" stroke="#6B6B6B" stroke-width="0.6"/>
<!-- Left leg rock -->
<ellipse cx="19" cy="36" rx="3" ry="2.2" fill="url(#rock3)" stroke="#6B6B6B" stroke-width="0.6"/>
<!-- Right leg rock -->
<ellipse cx="29" cy="36" rx="3" ry="2.2" fill="url(#rock3)" stroke="#6B6B6B" stroke-width="0.6"/>
<!-- Spirit sparkles -->
<circle cx="10" cy="12" r="1" fill="#7fdbca" opacity="0.7"/>
<circle cx="37" cy="10" r="0.8" fill="#7fdbca" opacity="0.5"/>
<circle cx="8" cy="22" r="0.6" fill="#a0e8d8" opacity="0.6"/>
<circle cx="39" cy="20" r="0.7" fill="#a0e8d8" opacity="0.5"/>
<defs>
<linearGradient id="bg" x1="5" y1="5" x2="43" y2="43" gradientUnits="userSpaceOnUse">
  <stop stop-color="#c8e6f0"/>
  <stop offset="1" stop-color="#a3c4d1"/>
</linearGradient>
<linearGradient id="rock" x1="15" y1="21" x2="33" y2="35" gradientUnits="userSpaceOnUse">
  <stop stop-color="#A0A0A0"/>
  <stop offset="1" stop-color="#787878"/>
</linearGradient>
<linearGradient id="rock2" x1="17" y1="11" x2="31" y2="23" gradientUnits="userSpaceOnUse">
  <stop stop-color="#B0B0B0"/>
  <stop offset="1" stop-color="#8A8A8A"/>
</linearGradient>
<linearGradient id="rock3" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
  <stop stop-color="#9A9A9A"/>
  <stop offset="1" stop-color="#757575"/>
</linearGradient>
</defs>
</svg>
