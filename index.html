<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Toolkit</title>
  <meta name="description"
    content="Discover scenic viewpoints with mountain views for picnics and camping. Browser-based terrain analysis powered by open elevation data.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Desktop Background (Bliss wallpaper) -->
  <div id="desktop-bg"></div>

  <!-- Desktop Icons -->
  <div id="desktop-icons">
    <div class="desktop-icon" id="icon-search-spots" title="Search for Spots" data-i18n-attr="title:searchForSpots">
      <img src="assets/map_icon.svg" alt="Search" class="desktop-icon-img">
      <span class="desktop-icon-label" data-i18n="searchForSpots">Search for Spots</span>
    </div>
    <div class="desktop-icon" id="icon-starred-spots" title="Starred Spots" data-i18n-attr="title:starredSpots">
      <img src="assets/star_icon.svg" alt="Starred" class="desktop-icon-img">
      <span class="desktop-icon-label" data-i18n="starredSpots">Starred Spots</span>
    </div>
    <div class="desktop-icon" id="icon-loved-spots" title="Loved Spots" data-i18n-attr="title:lovedSpots">
      <img src="assets/heart_icon.svg" alt="Loved" class="desktop-icon-img">
      <span class="desktop-icon-label" data-i18n="lovedSpots">Loved Spots</span>
    </div>
    <div class="desktop-icon" id="icon-rocky" title="Rocky" data-i18n-attr="title:rocky">
      <img src="assets/rocky_icon.svg" alt="Rocky" class="desktop-icon-img">
      <span class="desktop-icon-label" data-i18n="rocky">Rocky</span>
    </div>
  </div>

  <!-- Leaflet trash menu -->
  <div id="recycle-menu" class="recycle-menu" hidden>
    <button class="recycle-menu-item" id="recycle-clear-all" data-i18n="clearAll">Clear All</button>
    <button class="recycle-menu-item" id="recycle-clear-selection" data-i18n="clearSelection">Clear Selection</button>
  </div>

  <!-- Search Bar (Win7 style) -->
  <div id="search-bar">
    <input type="text" id="search-input" placeholder="Search " readonly data-i18n-placeholder="searchPlaceholder">
    <img src="assets/magnifier_icon.svg" alt="Search" class="search-magnifier">
  </div>

  <!-- Earth Globe Widget (3D interactive — rendered by globe.js / p5.js) -->
  <div id="earth-globe"></div>
  <div id="globe-attribution" class="globe-attribution"></div>

  <!-- Main Window -->
  <div id="main-window">
    <!-- Titlebar -->
    <div id="window-titlebar">
      <div class="titlebar-leading">
        <img src="assets/search_icon.svg" alt="" class="titlebar-icon">
        <span class="titlebar-text" data-i18n="searchForSpotsTitle">Search For Spots</span>
      </div>
      <div class="titlebar-trailing">
        <button class="titlebar-btn" id="btn-help" title="Help" data-i18n-attr="title:help">
          <img src="assets/help_icon.svg" alt="Help" width="20" height="20">
        </button>
        <button class="titlebar-btn titlebar-btn-maximize" id="btn-maximize-main" title="Maximize" data-i18n-attr="title:maximize">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="14" height="14" rx="1.5" stroke="white" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-close" title="Close" data-i18n-attr="title:close">
          <img src="assets/close_icon.svg" alt="Close" width="20" height="20">
        </button>
      </div>
    </div>

    <!-- Window Borders -->
    <div class="window-border window-border-left"></div>
    <div class="window-border window-border-right"></div>
    <div class="window-border window-border-bottom"></div>

    <!-- Resize Handles -->
    <div class="resize-handle resize-n"></div>
    <div class="resize-handle resize-s"></div>
    <div class="resize-handle resize-e"></div>
    <div class="resize-handle resize-w"></div>
    <div class="resize-handle resize-ne"></div>
    <div class="resize-handle resize-nw"></div>
    <div class="resize-handle resize-se"></div>
    <div class="resize-handle resize-sw"></div>

    <!-- Window Content -->
    <div id="window-content">
      <!-- Controls Panel (flush left side panel) -->
      <div id="controls-toggle" class="controls-toggle" title="Toggle filters" data-i18n-attr="title:toggleFilters">
        <svg class="controls-toggle-chevron" width="10" height="18" viewBox="0 0 10 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 1L2 9M8 17L2 9" stroke="#D5B456" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <aside id="controls-panel">
        <div class="panel-content">
          <div class="slider-group-label" data-i18n="viewpointCriteria">Viewpoint Criteria</div>

          <div class="controls-grid">
            <div class="control-group">
              <span class="label-text" data-i18n="minimumElevation">Minimum Elevation</span>
              <div class="slider-row">
                <div class="slider-track-container" data-tall-every="5">
                  <input type="range" id="min-elevation" min="0" max="3000" value="200" step="50">
                </div>
                <span class="label-value" id="min-elevation-val">200m</span>
              </div>
            </div>

            <div class="control-group">
              <span class="label-text" data-i18n="maxSlope">Max Slope</span>
              <div class="slider-row">
                <div class="slider-track-container" data-tall-every="5">
                  <input type="range" id="max-slope" min="1" max="45" value="15" step="1">
                </div>
                <span class="label-value" id="max-slope-val">15°</span>
              </div>
            </div>
          </div>

          <div class="slider-group-label" data-i18n="scenery">Scenery</div>

          <div class="controls-grid">
            <div class="control-group">
              <span class="label-text" data-i18n="closeness">Closeness</span>
              <div class="slider-row">
                <div class="slider-track-container" data-tall-every="5">
                  <input type="range" id="search-radius" min="1" max="20" value="5" step="1">
                </div>
                <span class="label-value" id="search-radius-val">5 km</span>
              </div>
            </div>

            <div class="control-group">
              <span class="label-text" data-i18n="valleyDepth">Valley depth</span>
              <div class="slider-row">
                <div class="slider-track-container" data-tall-every="5">
                  <input type="range" id="min-valley-depth" min="10" max="500" value="50" step="10">
                </div>
                <span class="label-value" id="min-valley-depth-val">50m</span>
              </div>
            </div>

            <div class="control-group">
              <span class="label-text" data-i18n="minPeakProminence">Min Peak Prominence</span>
              <div class="slider-row">
                <div class="slider-track-container" data-tall-every="4">
                  <input type="range" id="min-prominence" min="50" max="1000" value="200" step="25">
                </div>
                <span class="label-value" id="min-prominence-val">200m</span>
              </div>
            </div>
          </div>

          <div class="undo-redo-row">
            <button id="undo-btn" class="undo-redo-btn" title="Undo (Ctrl+Z)" disabled data-i18n="undo" data-i18n-attr="title:undoTooltip">↶ Undo</button>
            <button id="redo-btn" class="undo-redo-btn" title="Redo (Ctrl+Shift+Z)" disabled data-i18n="redo" data-i18n-attr="title:redoTooltip">↷ Redo</button>
          </div>

          <button id="analyze-btn" class="xp-primary-btn" disabled>
            <span class="btn-text" data-i18n="analyzeArea">Analyze Area</span>
          </button>

        </div>
      </aside>

      <!-- Map fills the remaining space -->
      <div id="map"></div>

      <!-- Results Panel -->
      <div id="results-panel" class="xp-panel" hidden>
        <div class="xp-panel-header">
          <h2>Viewpoints <span id="results-count" class="badge">0</span></h2>
          <button id="close-results" class="xp-icon-btn" title="Close" data-i18n-attr="title:close">✕</button>
        </div>
        <div id="results-list" class="results-list"></div>
      </div>

      <!-- Progress Overlay -->
      <div id="progress-overlay" hidden>
        <div class="progress-card xp-dialog">
          <div class="progress-spinner"></div>
          <h3 id="progress-title" data-i18n="analyzingTerrain">Analyzing Terrain</h3>
          <p id="progress-text" data-i18n="preparing">Preparing...</p>
          <div class="progress-track">
            <div id="progress-bar" class="progress-fill"></div>
          </div>
          <p id="progress-detail" class="progress-detail"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Loved Spots Window -->
  <div id="loved-window" class="xp-window" hidden>
    <div id="loved-window-titlebar" class="window-titlebar">
      <div class="titlebar-leading">
        <img src="assets/heart_icon.svg" alt="" class="titlebar-icon">
        <span class="titlebar-text" data-i18n="lovedSpotsTitle">Loved Spots</span>
      </div>
      <div class="titlebar-trailing">
        <button class="titlebar-btn titlebar-btn-maximize" id="btn-maximize-loved" title="Maximize" data-i18n-attr="title:maximize">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="14" height="14" rx="1.5" stroke="white" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-close-loved" title="Close" data-i18n-attr="title:close">
          <img src="assets/close_icon.svg" alt="Close" width="20" height="20">
        </button>
      </div>
    </div>
    <div class="window-border window-border-left"></div>
    <div class="window-border window-border-right"></div>
    <div class="window-border window-border-bottom"></div>
    <div class="resize-handle resize-n"></div>
    <div class="resize-handle resize-s"></div>
    <div class="resize-handle resize-e"></div>
    <div class="resize-handle resize-w"></div>
    <div class="resize-handle resize-ne"></div>
    <div class="resize-handle resize-nw"></div>
    <div class="resize-handle resize-se"></div>
    <div class="resize-handle resize-sw"></div>
    <div class="xp-window-content">
      <div class="xp-panel-header">
        <h2>Loved Spots <span id="loved-count" class="badge">0</span></h2>
      </div>
      <div id="loved-list" class="results-list"></div>
    </div>
  </div>

  <!-- Starred Spots Window -->
  <div id="starred-window" class="xp-window" hidden>
    <div id="starred-window-titlebar" class="window-titlebar">
      <div class="titlebar-leading">
        <img src="assets/star_icon.svg" alt="" class="titlebar-icon">
        <span class="titlebar-text" data-i18n="starredSpotsTitle">Starred Spots</span>
      </div>
      <div class="titlebar-trailing">
        <button class="titlebar-btn titlebar-btn-maximize" id="btn-maximize-starred" title="Maximize" data-i18n-attr="title:maximize">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="14" height="14" rx="1.5" stroke="white" stroke-width="1.5"/>
          </svg>
        </button>
        <button class="titlebar-btn" id="btn-close-starred" title="Close" data-i18n-attr="title:close">
          <img src="assets/close_icon.svg" alt="Close" width="20" height="20">
        </button>
      </div>
    </div>
    <div class="window-border window-border-left"></div>
    <div class="window-border window-border-right"></div>
    <div class="window-border window-border-bottom"></div>
    <div class="resize-handle resize-n"></div>
    <div class="resize-handle resize-s"></div>
    <div class="resize-handle resize-e"></div>
    <div class="resize-handle resize-w"></div>
    <div class="resize-handle resize-ne"></div>
    <div class="resize-handle resize-nw"></div>
    <div class="resize-handle resize-se"></div>
    <div class="resize-handle resize-sw"></div>
    <div class="xp-window-content">
      <div class="xp-panel-header">
        <h2>Starred Spots <span id="starred-count" class="badge">0</span></h2>
      </div>
      <div id="starred-list" class="results-list"></div>
    </div>
  </div>

  <!-- Help Tooltip -->
  <div id="help-tooltip" class="help-tooltip" hidden>
    <p class="help-tooltip-title"></p>
    <ol class="help-tooltip-list" id="help-tooltip-list"></ol>
    <div id="help-tooltip-footer" class="help-tooltip-footer" hidden></div>
  </div>

  <script>
    (function () {
      if (window.innerWidth <= 600) {
        // On mobile, start with main window hidden (home screen visible)
        document.getElementById('main-window').hidden = true;
        return;
      }
      ['main-window', 'loved-window', 'starred-window'].forEach(function (id) {
        var raw = localStorage.getItem('sv_layout_' + id);
        if (!raw) return;
        try {
          var l = JSON.parse(raw);
          var el = document.getElementById(id);
          if (!el) return;
          el.style.top    = l.top    + 'px';
          el.style.left   = l.left   + 'px';
          el.style.width  = l.width  + 'px';
          el.style.height = l.height + 'px';
        } catch (e) {}
      });
    })();
  </script>
  <script src="i18n.js"></script>
  <script>
    if (window.i18n) {
      window.i18n.ready.then(function () {
        return window.i18n.translatePage();
      });
    }
  </script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="terrain-tiles.js"></script>
  <script src="app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="globe.js"></script>
  <script src="vendor/desktop-buddy/desktop-buddy.iife.js"></script>
  <script src="tutorial.js"></script>
  <script src="buddy-integration.js"></script>
</body>

</html>
